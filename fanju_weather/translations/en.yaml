configuration:
  mode:
    name: Mode
    description: "emulator = answer the station ourselves, cloud independent (needs a static route on your router). bridge = forward to the real cloud so the vendor app keeps working (needs your router to hand out this host as DNS server). See the documentation."
  station_ip:
    name: Station IP address
    description: "IP address of the weather station in your network. Give it a fixed address (DHCP reservation)."
  timezone:
    name: Time zone
    description: "IANA time zone name, for example Europe/Berlin or America/New_York. In emulator mode the station clock is set from it."
  temperature_unit:
    name: Temperature unit
    description: "Unit of the published temperatures: celsius or fahrenheit. The station itself measures in Fahrenheit. Home Assistant can also convert the display per entity, so you only need this if you want the sensors themselves in Fahrenheit."
  debug:
    name: Debug log
    description: "Log every received measurement (about one line per minute). Off by default; the log then only shows start-up, mode changes and problems."
  indoor_offset:
    name: Indoor temperature offset
    description: "Correction in degrees Celsius (also when the unit is Fahrenheit) added to the indoor temperature (-5 to 5). Usually 0."
