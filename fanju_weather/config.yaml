name: "Fanju Weather Station (Local Server)"
version: "1.0.0"
slug: fanju_weather
description: "Reads Fanju Wi-Fi weather stations locally, cloud-independent or via a bridge to the real cloud (tested with the FJW4) and publishes the values to Home Assistant via MQTT"
url: "https://github.com/Blinchik91/ha-addon-fanju-weather"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
services:
  - mqtt:need
options:
  mode: "emulator"
  station_ip: ""
  timezone: "UTC"
  temperature_unit: "celsius"
  indoor_offset: 0.0
schema:
  mode: list(emulator|bridge)
  station_ip: str
  timezone: str
  temperature_unit: list(celsius|fahrenheit)
  indoor_offset: float(-5,5)
